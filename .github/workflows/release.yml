name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  revision:
    name: Validate an existing version tag on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/build_release.py --validate-tag "$RELEASE_TAG"

  validate:
    needs: revision
    uses: ./.github/workflows/tests.yml
    with:
      revision: ${{ needs.revision.outputs.sha }}
      version: ${{ needs.revision.outputs.tag }}
    permissions:
      contents: read

  publish:
    name: Publish the tested bundle to GitHub Releases only
    needs: [revision, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-application-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify identity and checksums before publication
        env:
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          RELEASE_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python -c 'import json,os; m=json.load(open("RELEASE_MANIFEST.json")); assert m["version"]==os.environ["RELEASE_TAG"]; assert m["commit"]==os.environ["RELEASE_SHA"]'
      - name: Create a draft, upload all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          PRERELEASE: ${{ needs.revision.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists; refusing to replace its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            --title "Paper Compass $RELEASE_TAG" dist/*.tar.gz dist/RELEASE_MANIFEST.json dist/SHA256SUMS
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
