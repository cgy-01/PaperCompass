name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_FIREHOSE_DATA_DIR: ${{ runner.temp }}/paper-compass-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install declared dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci
      - name: Test
        run: |
          python -m pytest -q
          node --test tests/frontend_routes.mjs tests/frontend_typography.mjs tests/frontend_api.mjs
