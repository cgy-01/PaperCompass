name: Build package (manual)

on:
  workflow_dispatch:
    inputs:
      publish_package:
        description: "Publish to PyPI only after package identity, assets and Trusted Publishing are configured"
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: |
          rm -rf dist/
          python -m build

      - name: Publish to PyPI
        if: ${{ inputs.publish_package == true }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
